; ============================================================================
;  llama.cpp-qwen38-flash - fork feature file
; ----------------------------------------------------------------------------
;  SWITCHES ONLY. Numbers live in llmserver.bat / llmserver.sh.
;  A CLI argument always overrides this file.
;
;    UPPER_CASE_KEY = value    -> environment variable
;    some-arg-name = value     -> argument without the leading dashes
;    ; or # in front           -> off
;
;  [common] or no header : every model
;  [qwen] [lfm] [bonsai] : only when named by --features-section
; ============================================================================

; ---------------------------------------------------------------------------
;  OURS, not upstream. After a merge check each control point still exists and
;  still does something -- a switch read but ineffective means lost code.
;  File-level inventory: docs/private-fork.md
;
;  q3_0 K/V ....... -ctk/-ctv q3_0 + GGML_TYPE_Q3_0
;  tiered KV ...... GGML_CUDA_KV_TIER_*      tier = chunk pool ... CELLS
;  draft .......... spec-draft-vocab-map, spec-draft-sampling
;  kernels ........ GGML_CUDA_FA_SHORTQ_MMA, GGML_CUDA_FA_SPARSE,
;                   GGML_CUDA_PTQ1_MMVQ_MAX, LLAMA_MTP_DRAFT_UBATCH
;  no switch ...... slot resume + per-depth telemetry (server-context.cpp)
; ---------------------------------------------------------------------------


; ---------------------------------------------------------------------------
;  environment switches (common)
; ---------------------------------------------------------------------------

; 0 = in-place q8_0 K/V kernel (recommended) | 1 = upstream #189 f16 MMA path
GGML_CUDA_FA_SHORTQ_MMA = 0

; 1 = an evicted checkpoint reuses its buffers (upstream) | 0 = always fresh
LLAMA_CKPT_REUSE = 1

; 1 = target and draft share one CUDA pool (-1.4 GB), needs --parallel 1
GGML_CUDA_SHARED_POOL = 1

; --- profiling: writes files, never the console. All off to ship. -----------
; 1 = per-round split pre/draft/dec/round/post | 0 = off
SPC_SRV_TIMING = 1
; 1 = MMQ tile choice | 0 = off
GGML_CUDA_MMQ_LOG = 1
; 1 = FA kernel routing | 0 = off
GGML_CUDA_FA_LOG = 1
; destination and line cap for the two logs above
GGML_CUDA_LOG_FILE = logs/mmfa.log
GGML_CUDA_LOG_MAX = 5000
; 0 = off | 1 = one line per decode | 2 = plus draft acceptance
LLAMA_PERF_LOG = 2
LLAMA_PERF_LOG_FILE = logs/perf.csv
; more probes, all off: GGML_CUDA_NO_GRAPHS=1  GGML_CUDA_GRAPH_SPAN=1
; GGML_CUDA_OP_TIMING=1 (graphs off only)  GGML_CUDA_TIER_TIMING=1

; correctness at the cost of speed. NOTE getenv() != nullptr, so = 0 turns it ON.
; GGML_CUDA_BATCH_INVARIANT = 1

; NOT SET HERE: GGML_CUDA_FA_CHUNK -- the launchers export it as CELLS, the
; chunk pool must cover exactly the VRAM tier. Setting it here would fight them.


; ---------------------------------------------------------------------------
;  engine switches (common)
; ---------------------------------------------------------------------------

; auto = fast top-k for normal sampling, off for our rejection sampler
;        on = always | off = never
sampler-fast-topk = auto


; ===========================================================================
;  [qwen]  Qwen3.8-27B-Flash-MTP : PTQ1_0 + MTP draft head + 128K
; ===========================================================================
[qwen]

; columns at which PT mat-vec hands over to MMQ. 5 = upstream default.
; 24 = keep multi-slot verify rows on mat-vec (much slower at 8 columns).
GGML_CUDA_PTQ1_MMVQ_MAX = 5

; wide-column PT kernel: not in this tree, so unreachable. N>0 = allow up to N
; columns, which a tree verify would want to be 16..48.
;GGML_CUDA_PTQ1_WIDE_COLS = 0

; micro-batch of the draft context. no-op without nextn layers.
LLAMA_MTP_DRAFT_UBATCH = 64

; match = sample-and-match | probabilistic = sample at request temp + rejection
spec-draft-sampling = probabilistic

; 24k draft-only shortlist, path relative to the working directory
spec-draft-vocab-map = maps/shortlist_24k_mix.vocab.txt

; gate on the draft's own top-1: 0 = off. p' = p^p-temp damps the head's
; overconfidence; the measured sweet spot is p-temp 1.6 with p-min ~0.45.
; tune p-min in 0.05 steps, p-temp in 0.2 steps, watch acceptance and tg
spec-draft-p-min = 0
spec-draft-p-temp = 1.0

; adaptive depth floor; --spec-draft-n-max bounds it from above
spec-draft-n-min-adaptive = 1

; ngram table kept on disk so a restart starts warm. Delete the line to rebuild.
spec-ngram-mod-cache = data/ngram-mod.cache

; [KV] the tier size lives in the launchers (CELLS == GGML_CUDA_FA_CHUNK).
; Current q3_0 / 90112 / 1232 MiB, so ~41k cells of the 128K sit in host RAM.

; keep the VRAM cells, the last R cells and the B best host pages of P cells,
; mask the rest. 0 = off. APPROXIMATE: pages are kept by an int8 upper bound,
; not exact top-k, so material outside the kept pages can be missed.
GGML_CUDA_FA_SPARSE = 8192,64,1024

; tiered KV path, ours (ggml_cuda_tier_*). Upstream #319 is a different one --
; do not let a merge replace these. Config present but ineffective = lost code.
; STAGING_FRAC: share of the tail that gets a staging buffer, 2.0 = whole tail
GGML_CUDA_KV_TIER_STAGING_FRAC = 2.0
; 1 = stage the next op while the current one runs | 0 = synchronous
GGML_CUDA_KV_TIER_PREFETCH = 1
; 1 = redirect set_rows into the staging alias, so a write cannot alias the read
GGML_CUDA_KV_TIER_REDIRECT = 1
; 0 = pipeline below the tier | 1 = keep the CUDA graph (older, slower)
GGML_CUDA_KV_TIER_GRAPHS = 0

; packed int32 KQ mask: cheaper decode, expensive prefill at 128K.
; kq-mask-packed = 1


; ===========================================================================
;  [lfm]  LFM2.5-24B-A2B : IQ2_XXS MoE, no MTP head, 8K working context
; ===========================================================================
;  Differences are launch parameters only, see llmserver-lfm.bat.
;  Do NOT copy from [qwen]: PTQ1_MMVQ_MAX (IQ2_XXS here), kv-vram-cells
;  (32768 > its 8K context), spec-draft-* (no nextn layer to draft with).
[lfm]
; (empty on purpose - add model-specific switches here as they appear)


; ===========================================================================
;  [bonsai]  Ternary-Bonsai-2-9B (Qwen3.5-9B backbone) : PQ2_0 + MTP head + 262K
;  Same family as the 27B (qwen35 hybrid, GDN layers, 1 nextn layer) at a
;  smaller width. Does NOT transfer: PTQ1_0 settings (PQ2_0 here) and the
;  tiered KV cache (its whole 128K KV fits in VRAM).
; ===========================================================================
[bonsai]
; micro-batch of the MTP draft context, same meaning as on the 27B
LLAMA_MTP_DRAFT_UBATCH = 64

; draft sampling: rejection sampling at the request temperature
spec-draft-sampling = probabilistic

; adaptive depth floor; --spec-draft-n-max stays in the launcher
; (measured best: n-max 2, n-max 4 costs a few t/s)
spec-draft-n-min-adaptive = 1

; same 24k shortlist as the 27B -- both carry the same 248320-token vocabulary
spec-draft-vocab-map = maps/shortlist_24k_mix.vocab.txt
