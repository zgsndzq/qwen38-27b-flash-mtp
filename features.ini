; ============================================================================
;  llama.cpp-qwen38-flash - fork feature file
; ----------------------------------------------------------------------------
;  This is the only place where OUR features are configured. The engine reads it
;  itself ("llama-server --features-file features.ini"), so the launch script
;  holds nothing but the normal runtime parameters.
;
;  What belongs here: anything the upstream engine does not know.
;    upstream : -c -b -t -ngl -fa -rea --parallel --host --port --alias
;               --spec-draft-n-max --spec-draft-p-min --reasoning-budget
;    ours     : sampler-fast-topk, spec-draft-sampling, spec-draft-p-min-keep,
;               spec-draft-vocab-map, kv-vram-cells, kq-mask-packed,
;               and every GGML_CUDA_* / LLAMA_* environment switch
;
;  How to edit
;    a key shaped like an environment variable (upper case, digits, underscore)
;      - exported as an environment variable
;    any other key
;      - an argument name without its leading dashes, example:
;          spec-draft-sampling = probabilistic
;    to drop a feature, delete or comment out its line with ; or #
;    explicit command-line arguments win over this file
;
;  Sections (one file, several models)
;    no header, or [common]      -> applied for every model
;    [qwen]                      -> applied when --features-section qwen
;    [lfm]                       -> applied when --features-section lfm
;    A named block is skipped unless the launcher names it:
;      llmserver.bat      ... --features-file features.ini --features-section qwen
;      llmserver-lfm.bat  ... --features-file features.ini --features-section lfm
;    Rule of thumb: a knob that only exists because of PTQ1_0, MTP or a 128K
;    context belongs to [qwen]; everything the CUDA backend reads regardless of
;    model stays common.
;
;  The values below are exactly the ones the engine ran with before this file
;  existed, so loading the file did not change any default.
; ============================================================================


; ---------------------------------------------------------------------------
;  environment switches (common)
; ---------------------------------------------------------------------------

; [upstream #189] a short query, Q 3 to 4, with a quantized V cache is pushed
;   onto the F16 MMA kernel: it dequantises the whole K/V cache into a scratch
;   buffer on every pass and uses a 64-wide Q tile for only 3 or 4 real rows.
;   0 = ignore #189 and keep the in-place q8_0 kernel. This is also the engine
;   default now, because the guard is redundant here: the caller already only
;   enters a quantized kernel after the in-place instance was found usable.
;   1 = upstream behaviour, kept for A/B only. Measured 2026-10-10 on this model:
;   with 1 an MTP request repeats one token and acceptance drops to 0.12, with 0
;   the identical request is clean (319 characters) and faster (27.1 vs 24.9).
;   What it blocks is our own speed feature - reading q8_0 K/V in place - and it
;   blocked it exactly on the MTP verify step, the hottest FA call we have.
;   upstream #312 (LLAMA_CKPT_REUSE below) was ruled out in the same sweep.
GGML_CUDA_FA_SHORTQ_MMA = 0

; [upstream #312] an evicted prompt checkpoint hands its buffers to the new one.
;   1 = upstream, 0 = always allocate fresh zero-filled buffers.
;   bisect knob B.
LLAMA_CKPT_REUSE = 1

; [CUDA arena] target and draft context share one pool, saves about 1.4 GB on an
;   8 GB card. only safe while --parallel is 1.
GGML_CUDA_SHARED_POOL = 1

; [perf] 解码埋点 —— 测速时打开，发布时保持注释。
;   LLAMA_PERF_LOG = 1        每次 llama_decode 写一行：
;                             t_ms, kind=D, ctx(0=target 1=draft), batch 行数, 最大位置, 耗时 ms
;   LLAMA_PERF_LOG = 2        再加每轮投机接受数（kind=A），用于算接受率曲线
;   服务端每轮时间拆解（pre/draft/dec/round/post），T12 用
SPC_SRV_TIMING = 1
;   MMQ 分发的 tile 选择（J / fallback / tiles）——写文件不打屏
GGML_CUDA_MMQ_LOG = 1
;   FA 内核路由（T06）：每次注意力 op 打印选中哪个 kernel / gqa / 宽度 / native——写文件不打屏
GGML_CUDA_FA_LOG = 1
;   上面两路的输出文件与条数上限（采样：写满即停，不会无限增长）
GGML_CUDA_LOG_FILE = logs/mmfa.log
GGML_CUDA_LOG_MAX = 5000
; GGML_CUDA_NO_GRAPHS = 1
;   整图 GPU span 探针（每 256 图一次 event 对）
; GGML_CUDA_GRAPH_SPAN = 1   ; 查完关闭
;   op 级计时（每 100 个 graph 打一张表，仅在 graph 关闭时生效）
; GGML_CUDA_OP_TIMING = 1
; GGML_CUDA_TIER_TIMING = 1
;   LLAMA_PERF_LOG_FILE=...   写到文件；不设则写 stderr
;   logs/perf.csv 会被 gitignore 挡住，随包发布时这个文件不存在就自动关闭。
;   实时看：python tools\perf_monitor.py logs\perf.csv
LLAMA_PERF_LOG = 2
LLAMA_PERF_LOG_FILE = logs/perf.csv

; optional, currently off - delete the leading ";" to enable
; [correctness] batch-invariant kernels, costs speed. the backend tests this with
;   getenv() not equal to nullptr, so writing = 0 also turns it ON, remove the line instead.
; GGML_CUDA_BATCH_INVARIANT = 1

; [attention, prefill] GGML_CUDA_FA_CHUNK=C. Prefill-sized attention over a long
;   quantized K/V runs the KV dimension in chunks of C cells (multiple of 256):
;   each chunk is copied to VRAM if it reaches the host tail, converted to f16 in
;   a pool buffer sized by C, and folded into the result. Memory is bounded by C
;   instead of the context length, so deep prefill no longer needs the whole f16
;   copy. Unset or 0: off.
GGML_CUDA_FA_CHUNK = 8192


; ---------------------------------------------------------------------------
;  engine switches (common)
; ---------------------------------------------------------------------------

; [sampling, upstream #313] take the top-k candidates straight from the logits.
;   auto = on for normal sampling and off for our rejection sampler, which needs
;   the untruncated distribution. on = upstream everywhere. off = never.
sampler-fast-topk = auto


; ===========================================================================
;  [qwen]  Qwen3.8-27B-Flash-MTP : PTQ1_0 weights + MTP draft head + 128K
; ===========================================================================

; [PTQ1 mat-vec] column count at which the kernel crosses from PT over to MMQ.
;   upstream already defaults to 5, written out here so the value is explicit.
;   24 = keep batched verify rows (multi-slot) on the mat-vec path instead of dropping
;   into the tile path, which is much less efficient at low column counts.
;   Measured 2026-10-20: 8 columns on the mat-vec path drop to 13-25 t/s against
;   62 t/s when the same call goes to MMQ, so 5 stands.
[qwen]
GGML_CUDA_PTQ1_MMVQ_MAX = 5

; [MTP draft] micro-batch of the draft context. no-op on a model without nextn layers.
LLAMA_MTP_DRAFT_UBATCH = 64

; [draft] how the draft tokens are sampled. match = sample-and-match,
;   probabilistic = true sampling at the request temperature plus our rejection
;   sampling.
spec-draft-sampling = probabilistic

; [draft] 24k draft-only shortlist for the MTP head. paths are relative to the
;   working directory, which llmserver.bat sets to this folder.
spec-draft-vocab-map = maps/shortlist_24k_mix.vocab.txt

; [draft] p_min gate on the draft's own top-1 probability, plus a damping exponent.
;   p-min 0 = off (historical). Measured 2026-10-20 with LLAMA_SPEC_DUMP: the MTP head reports a
;   median 0.82 on steps the target accepts only 0.50 of, and still >=0.95 on a third of them --
;   it is over-confident. p' = p^p-temp puts the gate back on the real scale: with p-temp 1.6 and
;   p-min ~0.45 the ~22% of steps below p 0.5 are cut instead of drafted and rejected.
;   Tune p-min in steps of 0.05 and p-temp in steps of 0.2; watch draft acceptance and tg.
spec-draft-p-min = 0
spec-draft-p-temp = 1.0

; [draft] adaptive depth floor: the controller starts here and never drops below;
;   --spec-draft-n-max in the launch script bounds it from above.
spec-draft-n-min-adaptive = 1

; [KV] cells 0 to N stay in VRAM, the rest is read from pinned RAM.
;   must not exceed CTX in llmserver.bat, equal to CTX keeps everything in VRAM.
;   CTX is 131072 and this is 65536, so the 65536-cell host tail costs 1.18 GB of
;   RAM (18 KB per token: 4 KV heads, K and V 256 wide, 16 attention layers, q4_0).
;   this is what lets 128K fit: at 32768 the cells beyond the tier went to host and a
;   64K sequence ran at 12.8 t/s; 65536 fits at 7858/8188 MiB. past 64K deep, the
;   tail is read over PCIe, which is what GGML_CUDA_FA_SPARSE below is for.
kv-vram-cells = 65536

; [attention, sparse] GGML_CUDA_FA_SPARSE=B,P,R. Decode-sized attention over the
;   host tail keeps the VRAM cells, the last R cells and the B best-scoring host
;   pages of P cells, and masks the rest, so the per-step host traffic drops from
;   the whole tail to B cells. Upstream on a 4070 with the same 32768-cell tier:
;   160k decode 13.8 -> 27.3 t/s. APPROXIMATE: pages are kept by an int8 upper
;   bound, not an exact top-k, so retrieval over material that falls outside the
;   kept pages can miss. B=8192 keeps 1/12 of the current 98304-cell tail.
GGML_CUDA_FA_SPARSE = 8192,64,1024

; [attention] keep the int32 KQ mask packed instead of expanding it to f16.
;   this one has no value of its own, it is on as long as the line is here.
;   OFF at CTX 131072. Measured 2026-10-18, 3315-token prompt, same binary:
;     packed off                    -> pp 430 t/s, tg 38.7
;     packed on                     -> pp 265 t/s, tg 40.5
;   The native-bit kernel path is NOT what is missing: mirai 4b0caa048 (the
;   MMA kernel expands the bits itself) has been in this tree since b62b212e0,
;   and forcing it changes nothing. The cost is the design: a packed mask tile
;   is expanded by a synchronous write loop that cannot overlap with cp_async,
;   so at 128K it costs more than one f16 expansion per op. Stays off until
;   that loop is vectorised; decode prefers packed by about 5 %.
; kq-mask-packed = 1


; ===========================================================================
;  [lfm]  LFM2.5-24B-A2B : IQ2_XXS MoE, no MTP head, 8K working context
; ===========================================================================
;  Nothing model-specific yet. The differences that exist are all launch
;  parameters and live in llmserver-lfm.bat:
;    --parallel 1      no second slot (2B active per token, MoE expert churn)
;    -c 8192           the 8 GB card cannot hold a 128K KV next to a 6.9 GB model
;    -ctk q4_0 -ctv q4_0
;  Knobs that must NOT be copied here from [qwen]:
;    GGML_CUDA_PTQ1_MMVQ_MAX   the file is IQ2_XXS, the PT path never runs
;    kv-vram-cells             32768 > this model's 8K context
;    spec-draft-*              there is no nextn layer to draft with
;    spec-draft-vocab-map      the shortlist accelerates a draft head that does not exist
[lfm]
; (empty on purpose - add model-specific switches here as they appear)
