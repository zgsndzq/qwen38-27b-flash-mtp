<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国象棋 · 棋盘布局</title>
<style>
  :root{
    --grid: 60px;
    --line: #6b4a2b;
    --board-bg: #f3ddb0;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:32px 16px;
    background: radial-gradient(circle at 50% 12%, #40301f, #1b130c 72%);
    font-family:"KaiTi","STKaiti","Songti SC","SimSun","Microsoft YaHei",serif;
    user-select:none;
  }
  h1{
    color:#e9d3a6;
    font-size:22px;
    letter-spacing:8px;
    margin:0;
    font-weight:600;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
  }

  /* 棋盘容器 */
  #board{
    position:relative;
    width:570px;
    height:630px;
    background-color:var(--board-bg);
    background-image:repeating-linear-gradient(
        90deg,
        rgba(120,80,30,.045) 0 2px,
        rgba(120,80,30,0)   2px 8px);
    border-radius:8px;
    box-shadow:
      0 0 0 5px #c9a063,
      0 0 0 7px #8a6432,
      0 26px 60px rgba(0,0,0,.65),
      inset 0 0 40px rgba(120,80,30,.18);
  }

  /* 网格线 / 对角线 */
  .line{
    position:absolute;
    background:var(--line);
    border-radius:2px;
    z-index:1;
  }

  /* 通用块（楚河汉界） */
  .block{
    position:absolute;
    overflow:hidden;
  }
  .river-text{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    white-space:nowrap;
    color:#7a5b34;
    font-size:28px;
    letter-spacing:26px;
    text-indent:26px;          /* 抵消最后一个字的字距，视觉居中 */
    opacity:.85;
  }

  /* 棋子 */
  .piece{
    position:absolute;
    width:52px;
    height:52px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    font-weight:700;
    line-height:1;
    z-index:20;
    cursor:pointer;
    background:radial-gradient(circle at 34% 28%, #fffdf4 0%, #f1e2bb 58%, #dcc496 100%);
    box-shadow:
      0 3px 6px rgba(0,0,0,.38),
      inset 0 0 0 2px rgba(255,255,255,.55),
      inset 0 -4px 8px rgba(140,100,50,.30);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .piece::after{               /* 内圈 */
    content:"";
    position:absolute;
    inset:5px;
    border-radius:50%;
    border:1.5px solid currentColor;
    opacity:.75;
    pointer-events:none;
  }
  .piece.red{
    color:#b3261e;
    border:3px solid #b3261e;
  }
  .piece.black{
    color:#1d1d1d;
    border:3px solid #1d1d1d;
  }
  .piece:hover{
    transform:translate(-50%,-50%) scale(1.06);
    box-shadow:
      0 6px 14px rgba(0,0,0,.45),
      inset 0 0 0 2px rgba(255,255,255,.65),
      inset 0 -4px 8px rgba(140,100,50,.30);
  }
  .piece.selected{
    transform:translate(-50%,-50%) scale(1.1);
    box-shadow:
      0 0 0 3px #ffcf47,
      0 8px 18px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
  <h1>中国象棋</h1>
  <div id="board"></div>

<script>
(function () {
  "use strict";

  /* ===== 1. 配置与坐标系统（网格 0-8 / 0-9 → 像素）===== */
  const CONFIG = {
    gridSize: 60,
    offsetX: 45,
    offsetY: 45,
    cols: 9,   // 9 条竖线
    rows: 10   // 10 条横线
  };
  const LINE_W = 2;
  const BOARD_BG = "#f3ddb0";

  const board = document.getElementById("board");

  function gridToPixel(gridX, gridY) {
    return {
      x: CONFIG.offsetX + gridX * CONFIG.gridSize,
      y: CONFIG.offsetY + gridY * CONFIG.gridSize
    };
  }

  /* ===== 2. 线条绘制函数 ===== */
  function drawVerticalLine(gridX, gridY1, gridY2) {
    const start = gridToPixel(gridX, gridY1);
    const end   = gridToPixel(gridX, gridY2);
    const line = document.createElement("div");
    line.className = "line";
    line.style.width  = LINE_W + "px";
    line.style.height = (end.y - start.y) + "px";
    line.style.left   = (start.x - LINE_W / 2) + "px";
    line.style.top    = start.y + "px";
    board.appendChild(line);
  }

  function drawHorizontalLine(gridY, gridX1, gridX2) {
    const start = gridToPixel(gridX1, gridY);
    const end   = gridToPixel(gridX2, gridY);
    const line = document.createElement("div");
    line.className = "line";
    line.style.width  = (end.x - start.x) + "px";
    line.style.height = LINE_W + "px";
    line.style.left   = start.x + "px";
    line.style.top    = (start.y - LINE_W / 2) + "px";
    board.appendChild(line);
  }

  function drawDiagonal(gridX1, gridY1, gridX2, gridY2) {
    const start = gridToPixel(gridX1, gridY1);
    const end   = gridToPixel(gridX2, gridY2);
    const dx = end.x - start.x;
    const dy = end.y - start.y;
    const length = Math.sqrt(dx * dx + dy * dy);
    const angle  = Math.atan2(dy, dx) * 180 / Math.PI;
    const line = document.createElement("div");
    line.className = "line";
    line.style.width  = length + "px";
    line.style.height = LINE_W + "px";
    line.style.left   = start.x + "px";
    line.style.top    = (start.y - LINE_W / 2) + "px";
    line.style.transformOrigin = "0 50%";
    line.style.transform = "rotate(" + angle + "deg)";
    board.appendChild(line);
  }

  /* 矩形填充块：从 (gridX1,gridY1) 到 (gridX2,gridY2) */
  function drawBlock(gridX1, gridY1, gridX2, gridY2, backgroundColor, zIndex) {
    const start = gridToPixel(gridX1, gridY1);
    const end   = gridToPixel(gridX2, gridY2);
    const block = document.createElement("div");
    block.className = "block";
    block.style.width  = (end.x - start.x) + "px";
    block.style.height = (end.y - start.y) + "px";
    block.style.left   = start.x + "px";
    block.style.top    = start.y + "px";
    block.style.backgroundColor = backgroundColor;
    block.style.zIndex = zIndex;
    board.appendChild(block);
    return block;
  }

  /* ===== 3. 画棋盘：网格 → 米字格 → 楚河汉界 ===== */

  // 9 条竖线（两侧边线贯通，中间 7 条在河界处断开）
  for (let x = 0; x < CONFIG.cols; x++) {
    if (x === 0 || x === CONFIG.cols - 1) {
      drawVerticalLine(x, 0, CONFIG.rows - 1);
    } else {
      drawVerticalLine(x, 0, 4);                 // 上半段
      drawVerticalLine(x, 5, CONFIG.rows - 1);   // 下半段
    }
  }

  // 10 条横线（贯通全宽）
  for (let y = 0; y < CONFIG.rows; y++) {
    drawHorizontalLine(y, 0, CONFIG.cols - 1);
  }

  // 米字格：连接「士/仕」到「將/帥」（上下两宫，共 4 条对角线）
  drawDiagonal(3, 0, 5, 2);   // 上宫
  drawDiagonal(5, 0, 3, 2);
  drawDiagonal(3, 9, 5, 7);   // 下宫
  drawDiagonal(5, 9, 3, 7);

  // 楚河汉界
  function drawRiver() {
    const block = drawBlock(0, 4, 8, 5, BOARD_BG, 5); // 高 z-index 覆盖河中多余的竖线
    // 微微内缩，保留上下横线与左右边线的完整
    block.style.left   = (parseFloat(block.style.left) + 1) + "px";
    block.style.top    = (parseFloat(block.style.top) + 1) + "px";
    block.style.width  = (parseFloat(block.style.width) - 2) + "px";
    block.style.height = (parseFloat(block.style.height) - 2) + "px";

    const text = document.createElement("div");
    text.className = "river-text";
    text.textContent = "楚河漢界";
    block.appendChild(text);
  }
  drawRiver();

  /* ===== 4. 棋子的初始布局 ===== */
  const INITIAL_PIECES = {
    black: [ // 上方（北）· 黑方
      { name: "車", x: 0, y: 0 }, { name: "馬", x: 1, y: 0 }, { name: "象", x: 2, y: 0 }, { name: "士", x: 3, y: 0 },
      { name: "將", x: 4, y: 0 }, { name: "士", x: 5, y: 0 }, { name: "象", x: 6, y: 0 }, { name: "馬", x: 7, y: 0 }, { name: "車", x: 8, y: 0 },
      { name: "炮", x: 1, y: 2 }, { name: "炮", x: 7, y: 2 },
      { name: "卒", x: 0, y: 3 }, { name: "卒", x: 2, y: 3 }, { name: "卒", x: 4, y: 3 }, { name: "卒", x: 6, y: 3 }, { name: "卒", x: 8, y: 3 }
    ],
    red: [   // 下方（南）· 红方
      { name: "車", x: 0, y: 9 }, { name: "馬", x: 1, y: 9 }, { name: "相", x: 2, y: 9 }, { name: "仕", x: 3, y: 9 },
      { name: "帥", x: 4, y: 9 }, { name: "仕", x: 5, y: 9 }, { name: "相", x: 6, y: 9 }, { name: "馬", x: 7, y: 9 }, { name: "車", x: 8, y: 9 },
      { name: "砲", x: 1, y: 7 }, { name: "砲", x: 7, y: 7 },
      { name: "兵", x: 0, y: 6 }, { name: "兵", x: 2, y: 6 }, { name: "兵", x: 4, y: 6 }, { name: "兵", x: 6, y: 6 }, { name: "兵", x: 8, y: 6 }
    ]
  };

  function createPiece(name, color, gridX, gridY) {
    const pos = gridToPixel(gridX, gridY);
    const piece = document.createElement("div");
    piece.className = "piece " + color;
    piece.textContent = name;
    piece.dataset.name  = name;
    piece.dataset.color = color;
    piece.dataset.x = gridX;
    piece.dataset.y = gridY;
    piece.style.left = pos.x + "px";
    piece.style.top  = pos.y + "px";
    piece.addEventListener("click", function (e) {
      e.stopPropagation();
      handleClick(piece);
    });
    board.appendChild(piece);
  }

  // 简单的选中高亮交互
  let selected = null;
  function handleClick(piece) {
    if (selected === piece) {
      piece.classList.remove("selected");
      selected = null;
      return;
    }
    if (selected) selected.classList.remove("selected");
    selected = piece;
    piece.classList.add("selected");
  }
  board.addEventListener("click", function () {
    if (selected) selected.classList.remove("selected");
    selected = null;
  });

  // 摆放全部 32 枚棋子
  Object.keys(INITIAL_PIECES).forEach(function (color) {
    INITIAL_PIECES[color].forEach(function (p) {
      createPiece(p.name, color, p.x, p.y);
    });
  });
})();
</script>
</body>
</html>
